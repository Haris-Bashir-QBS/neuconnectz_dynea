name: neuconnectz_dynea
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  go_router: ^12.1.3
  flutter_animate: ^4.5.2
  dropdown_search: ^6.0.2
  shimmer: ^3.0.0
  file_picker: ^9.2.2
  image_cropper: ^9.0.0
  image_picker: ^1.1.2
  fluttertoast: ^8.2.12
  dio: ^5.8.0+1
  bloc: ^9.0.0
  fpdart: ^1.1.1
  connectivity_plus: ^6.0.2
  logger: ^2.5.0
  equatable: ^2.0.7
  flex_color_picker: ^3.7.0
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  fl_chart: ^0.70.2
  flutter_slidable: ^4.0.0
  rxdart: ^0.28.0
  flutter_localization: ^0.3.2
  mobile_scanner: ^6.0.10
  persistent_bottom_nav_bar: ^6.2.1
  device_preview: ^1.2.0
  dotted_border: ^2.1.0
  sentry_flutter: ^8.14.2
  #chucker_flutter: 1.8.5
  toastification: ^3.0.2
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  pin_code_fields: ^8.0.1
  device_info_plus: ^11.4.0
  flutter_spinkit: ^5.2.1
  reorderable_grid_view: ^2.2.8
  google_fonts: ^6.2.1
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  cherry_toast: ^1.13.0
  package_info_plus: ^8.3.0
  shorebird_code_push: ^2.0.4
  flutter_flavorizr: ^2.4.1
  terminate_restart: ^1.0.11
  alice: ^1.0.0
  alice_dio: ^1.0.7
  simple_barcode_scanner:
    path: simple_barcode_scanner_0.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  permission_handler: ^12.0.1



flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter_28pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter_28pt-Black.ttf
          weight: 900

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf

    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf